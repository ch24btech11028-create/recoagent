# Every claim in the README that can be checked by a machine, checked by a
# machine that is not the author's laptop.
#
# The `bare` job is the one that earns its place. "No third-party dependencies"
# is a claim a repository can only make honestly if something runs the pipeline
# on an interpreter where nothing is installed -- `tests/test_no_dependencies.py`
# blocks imports at the hook, which is a good proxy, but a clean runner with an
# empty site-packages is the real thing.

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: pytest
        run: python -m pytest -q

  bare:
    name: no dependencies, no key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No `pip install` anywhere in this job. Printed rather than asserted
      # empty, because a runner image may ship a package or two of its own and
      # a red build for that would say nothing true about this repository --
      # what matters is that nothing here was installed for it.
      - name: what is installed
        run: python -m pip list --format=freeze
      - name: neither LLM SDK is present
        run: |
          python - <<'PY'
          import importlib.util, sys
          present = [m for m in ("openai", "anthropic") if importlib.util.find_spec(m)]
          if present:
              sys.exit(f"{present} is installed; this job is meant to run without it")
          PY
      # `run` exits non-zero on its own if the book fails to reconcile or the
      # false-match rate is not zero, so these are assertions, not smoke tests.
      - name: B0 and B2 reconcile
        run: |
          python -m recoagent.run --n 2000 --seed 7  --profile dev     --rung B0
          python -m recoagent.run --n 2000 --seed 7  --profile dev     --rung B2
          python -m recoagent.run --n 2000 --seed 21 --profile holdout --rung B2
          python -m recoagent.run --n 2000 --seed 7  --profile clean   --rung B2
      - name: the same seed produces the same run, byte for byte
        run: |
          python -m recoagent.run --n 2000 --seed 7 --out a.json > /dev/null
          python -m recoagent.run --n 2000 --seed 7 --out b.json > /dev/null
          diff a.json b.json
      - name: published results still match what the code produces
        run: |
          python -m recoagent.run --n 2000 --seed 7  --profile dev     --rung B2 --out fresh_dev.json     > /dev/null
          python -m recoagent.run --n 2000 --seed 21 --profile holdout --rung B2 --out fresh_holdout.json > /dev/null
          diff fresh_dev.json     results/B2_dev.json
          diff fresh_holdout.json results/B2_holdout.json
      # Exits non-zero if anything was filed under a wrong category, so a
      # regression here is as loud as a false match.
      - name: the categorisation ladder holds
        run: |
          python -m recoagent.categorize.run --n 500 --seed 7  --profile dev     --rung C0
          python -m recoagent.categorize.run --n 500 --seed 7  --profile dev     --rung C1
          python -m recoagent.categorize.run --n 500 --seed 21 --profile holdout --rung C1
      # The only live-model result in the repository, re-derived from the
      # replies committed under data/llm-cache on a runner with no key and no
      # SDK. If it ever needs one, the claim that a reader can check it has
      # quietly become false.
      - name: the published C2 measurement replays with no key
        run: |
          python -m recoagent.categorize.run --n 500 --seed 7 --profile dev --rung C2 \
            --out fresh_c2.txt > /dev/null
          diff fresh_c2.txt results/C2_dev.txt
      # Seventeen attacks on the matcher, run on a machine that is not the
      # author's. Exits non-zero on any wrong match that is not a declared
      # limit, and on any crash -- so "0.00% false-match rate under adversarial
      # input" is gated rather than asserted. The two declared forgeries print
      # every run and deliberately do not fail the build; `test_mutation_audit`
      # is what stops that disclaimer outliving the weakness.
      - name: the matcher survives being attacked on purpose
        run: python -m recoagent.audit.mutate --n 2000 --trials 25
      # The published scorecard has to be what the code produces, same rule as
      # every other artifact in results/.
      - name: the published mutation scorecard still matches
        run: |
          python -m recoagent.audit.mutate --n 2000 --trials 25 --json > fresh_audit.json
          python - <<'PY'
          import json, sys
          fresh = json.load(open("fresh_audit.json"))
          published = json.load(open("results/mutation_audit.json"))
          if fresh != published:
              sys.exit("results/mutation_audit.json has drifted from the code")
          print("scorecard matches")
          PY
      # A recorded pull, so the Razorpay path is checked without a key. An
      # integration whose tests need credentials is an integration nobody finds
      # out has broken.
      - name: a Razorpay book reconciles from a recorded pull
        run: |
          python -m recoagent.razorpay.run reconcile tests/fixtures/razorpay/pull.json \
            --bank tests/fixtures/razorpay/bank.csv
      # A hook that has quietly stopped refusing is worse than no hook: it is
      # a guard everybody believes in. Plant the exact mistake it exists to
      # catch and require a non-zero exit.
      - name: the pre-commit guard still refuses a planted key
        run: |
          git config core.hooksPath .githooks
          git config user.email ci@example.com
          git config user.name CI
          # Assembled at runtime rather than written literally. A literal here
          # would be a credential-shaped string committed to the repository,
          # which this very hook refuses -- correctly, since it cannot tell a
          # fixture from the real thing and should not try.
          KEY="rzp""_test_A1b2C3d4E5f6G7"
          printf 'RAZORPAY_KEY_ID= "%s"\n' "$KEY" >> .env.example
          git add .env.example
          if git commit -m "this must not succeed"; then
            echo "the pre-commit hook let a credential through"
            exit 1
          fi
          git reset --hard HEAD
      # A timing on a shared runner is not a measurement, so this asserts the
      # sweep still runs and still scales -- the published numbers come from
      # `results/throughput.txt`, generated on a quiet machine.
      - name: throughput is still linear
        run: python -m recoagent.eval.throughput --sizes 500,5000 --repeats 1
      - name: the agent tier degrades instead of breaking
        run: python -m recoagent.eval.b3 --profile dev
