<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecoAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;450;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<!-- The shell every view is rendered into: the sidebar, the run bar, and the
     empty container the router fills.

     The shell holds the run controls because changing the run is not a screen.
     It is something you do *to* whichever screen you are looking at, and moving
     it into one of them would mean the others could not be trusted to say which
     book they were describing. -->
<div class="app">

  <aside class="side">
    <div class="brand">
      <span class="mark">R</span>
      <div><b>RecoAgent</b><small>settlement control</small></div>
    </div>

    <div class="navgroup">Operations</div>
    <nav class="nav">
      <a href="#/overview"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span>Overview</span></a>
      <a href="#/exceptions"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20L12 3z"/><path d="M12 10v4"/><path d="M12 17h.01"/></svg><span>Exception queue</span><span class="count" id="navq">—</span></a>
      <a href="#/agent"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v11H8l-4 4V5z"/><path d="M9 10h.01"/><path d="M13 10h.01"/></svg><span>Ask the agent</span></a>
    </nav>

    <div class="navgroup">Evidence</div>
    <nav class="nav">
      <a href="#/matches"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h7"/><path d="M13 7h7"/><path d="M4 17h7"/><path d="M13 17h7"/><circle cx="11.5" cy="7" r="2"/><circle cx="12.5" cy="17" r="2"/></svg><span>Match log</span><span class="count" id="navm">—</span></a>
      <a href="#/sources"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/><circle cx="8" cy="6" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="10" cy="18" r="1.4"/></svg><span>Source ledgers</span></a>
      <a href="#/assurance"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg><span>Assurance</span></a>
      <a href="#/results"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9l5 5v13H6z"/><path d="M15 3v5h5"/><path d="M9 13h7"/><path d="M9 17h5"/></svg><span>Published results</span></a>
      <a href="#/method"><svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg><span>How to read this</span></a>
    </nav>

    <div class="sidefoot" id="foot">—</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="ctx" id="ctx">no run yet</span>
      <span class="spacer"></span>
      <button class="ghost" id="toggle">Run settings</button>
      <button class="primary" id="go">Reconcile</button>
    </div>

    <div class="runbar" id="runbar">
      <div class="field"><label for="n">Orders</label>
        <input id="n" type="number" value="2000" min="100" max="50000" step="100"></div>
      <div class="field"><label for="seed">Seed</label><input id="seed" type="number" value="7"></div>
      <div class="field"><label for="profile">Defect mix</label>
        <select id="profile">
          <option value="dev">dev</option>
          <option value="holdout">held-out</option>
          <option value="clean">clean</option>
        </select></div>
      <div class="field"><label for="rung">Rung</label>
        <select id="rung">
          <option value="B2">B2 — solver</option>
          <option value="B0">B0 — exact keys</option>
        </select></div>
      <span class="spacer"></span>
      <div class="field"><label for="theme">Theme</label>
        <select id="theme">
          <option value="auto">auto</option>
          <option value="light">light</option>
          <option value="dark">dark</option>
        </select></div>
    </div>

    <div id="err"></div>
    <div class="view" id="view"></div>
  </main>
</div>
</body>
</html>
