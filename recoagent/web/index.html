<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RecoAgent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/app.css">
<script src="/app.js" defer></script>
</head>
<body>
<!-- The shell every view is rendered into: the sidebar, the run bar, and the
     empty container the router fills.

     The shell holds the run controls because changing the run is not a screen.
     It is something you do *to* whichever screen you are looking at, and moving
     it into one of them would mean the others could not be trusted to say which
     book they were describing. -->
<div class="app">

  <aside class="side">
    <div class="brand">
      <span class="mark">R</span>
      <div><b>RecoAgent</b><small>settlement control</small></div>
    </div>

    <div class="navgroup">Operations</div>
    <nav class="nav">
      <a href="#/overview"><span>Overview</span></a>
      <a href="#/exceptions"><span>Exception queue</span><span class="count" id="navq">—</span></a>
      <a href="#/agent"><span>Ask the agent</span></a>
    </nav>

    <div class="navgroup">Evidence</div>
    <nav class="nav">
      <a href="#/matches"><span>Match log</span><span class="count" id="navm">—</span></a>
      <a href="#/sources"><span>Source ledgers</span></a>
      <a href="#/assurance"><span>Assurance</span></a>
      <a href="#/results"><span>Published results</span></a>
      <a href="#/method"><span>How to read this</span></a>
    </nav>

    <div class="sidefoot" id="foot">—</div>
  </aside>

  <main class="main">
    <div class="topbar">
      <span class="live" id="live" title="showing the current run"></span>
      <span class="ctx" id="ctx">no run yet</span>
      <span class="spacer"></span>
      <button class="ghost" id="toggle">Run settings</button>
      <button class="primary" id="go">Reconcile</button>
    </div>

    <div class="runbar" id="runbar">
      <div class="field"><label for="n">Orders</label>
        <input id="n" type="number" value="2000" min="100" max="50000" step="100"></div>
      <div class="field"><label for="seed">Seed</label><input id="seed" type="number" value="7"></div>
      <div class="field"><label for="profile">Defect mix</label>
        <select id="profile">
          <option value="dev">dev</option>
          <option value="holdout">held-out</option>
          <option value="clean">clean</option>
        </select></div>
      <div class="field"><label for="rung">Rung</label>
        <select id="rung">
          <option value="B2">B2 — solver</option>
          <option value="B0">B0 — exact keys</option>
        </select></div>
      <span class="spacer"></span>
    </div>

    <div id="err"></div>
    <div class="view" id="view"></div>
  </main>
</div>
</body>
</html>
